fullnameOverride: movie-service

image:
  repository: julienmilonsesan/movie-service
  tag: "latest"

imagePullSecrets: []

service:
  type: NodePort
  port: 8000
  nodePort: 30001
  targetPort: 8000

env:
  - name: DATABASE_URI
    value: "postgresql://movie_db_username:movie_db_password@movie-db/movie_db_dev"
  - name: CAST_SERVICE_HOST_URL
    value: "http://cast-service:8000/api/v1/casts/"

healthCheckPath: "/api/v1/movies/"
